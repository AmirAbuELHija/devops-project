name: merge

on:
  push:
    branches:
      - main

jobs:
  image-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the image name
        id: name
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO deploy ${{ needs.image-push.outputs.image }} to AWS (Task 6)"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO call /healthz, then create, read and delete one book (Task 6)"