name: merge

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the image name
        id: name
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      IMAGE: ${{ needs.image-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Trade GitHub's ID token for AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}" --region "${{ vars.AWS_REGION }}"

      - name: Apply the manifests with this commit's image
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" deploy/deployment.yaml | kubectl apply -f -
          kubectl apply -f deploy/service.yaml

      - name: Wait for the rollout
        run: kubectl -n web rollout status deployment/books --timeout=180s

      - name: Find the load balancer's address
        id: url
        run: |
          for i in $(seq 30); do
            host=$(kubectl -n web get service books -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && break
            sleep 10
          done
          [ -n "$host" ] || { echo "No load balancer address after 5 minutes"; exit 1; }
          echo "url=http://$host" >> "$GITHUB_OUTPUT"
          echo "App URL: http://$host"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      URL: ${{ needs.deploy.outputs.url }}
    steps:
      - name: GET /healthz answers 200
        run: curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$URL/healthz"

      - name: POST /books answers 201
        run: |
          code=$(curl --silent --output /dev/stderr --write-out '%{http_code}' \
            -X POST "$URL/books" -H "Content-Type: application/json" \
            -d '{"title": "Smoke test", "author": "Pipeline"}')
          echo
          echo "Status: $code"
          [ "$code" = "201" ]